<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 800"
  width="100%"
  height="100%"
>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #0f172a; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #1e293b; stop-opacity: 1" />
    </linearGradient>

    <!-- Accent Gradient (Cyan to Purple) -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #06b6d4; stop-opacity: 1" />
      <stop offset="50%" style="stop-color: #3b82f6; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #6366f1; stop-opacity: 1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Dark Background -->
  <rect width="800" height="800" rx="160" fill="url(#grad)" />

  <!-- The Dependency Tree Network (Background Grid lines) -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="10,10">
    <line x1="400" y1="150" x2="400" y2="650" />
    <line x1="150" y1="400" x2="650" y2="400" />
    <line x1="220" y1="220" x2="580" y2="580" />
    <line x1="220" y1="580" x2="580" y2="220" />
  </g>

  <!-- Connection Nodes (Dependencies) -->
  <g fill="#475569">
    <circle cx="220" cy="220" r="16" />
    <circle cx="580" cy="220" r="16" />
    <circle cx="220" cy="580" r="16" />
    <circle cx="580" cy="580" r="16" />
  </g>

  <!-- Main Isometric Package / Hexagon -->
  <g transform="translate(400, 400)">
    <!-- Outer Hexagon (The Package Boundary) -->
    <polygon
      points="0,-220 190,-110 190,110 0,220 -190,110 -190,-110"
      fill="none"
      stroke="url(#accentGrad)"
      stroke-width="16"
      stroke-linejoin="round"
      filter="url(#glow)"
    />

    <!-- Isometric Inner Box Lines -->
    <path
      d="M0,0 L0,220"
      stroke="url(#accentGrad)"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.8"
    />
    <path
      d="M0,0 L190,-110"
      stroke="url(#accentGrad)"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.8"
    />
    <path
      d="M0,0 L-190,-110"
      stroke="url(#accentGrad)"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.8"
    />

    <!-- Dynamic "V" (Version) cutting through the center -->
    <path
      d="M-90,-15 L0,120 L90,-15"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glow)"
    />

    <!-- Glowing Core Node (The "Resolved" Version Point) -->
    <circle cx="0" cy="120" r="18" fill="#22C55E" filter="url(#glow)" />
    <circle cx="0" cy="120" r="10" fill="#FFFFFF" />
  </g>
</svg>
